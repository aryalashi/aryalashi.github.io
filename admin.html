<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Ashish Aryal</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --bg2: #111118; --bg3: #1a1a24; --card: #13131c;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --accent: #6ee7b7; --accent-dim: rgba(110,231,183,0.1);
    --danger: #f87171; --danger-dim: rgba(248,113,113,0.1);
    --warn: #fbbf24; --text: #f0f0f5; --text2: #9090a8; --text3: #5a5a70;
    --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    --radius: 12px; --radius-lg: 18px;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }

  /* LOGIN */
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; overflow: hidden; }
  .login-bg { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 60% 60% at 50% 40%, rgba(110,231,183,0.05) 0%, transparent 70%); }
  .login-grid { position: absolute; inset: 0; pointer-events: none; opacity: 0.3; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 80%); }
  .login-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 2.5rem; width: 100%; max-width: 400px; position: relative; z-index: 1; }
  .login-logo { font-family: var(--font-head); font-size: 1.5rem; font-weight: 800; color: var(--text); text-align: center; margin-bottom: 0.25rem; }
  .login-logo span { color: var(--accent); }
  .login-sub { text-align: center; color: var(--text3); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2rem; }
  .lock-icon { width: 56px; height: 56px; background: var(--accent-dim); border: 1px solid rgba(110,231,183,0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
  .lock-icon svg { width: 26px; height: 26px; color: var(--accent); }
  .form-group { margin-bottom: 1rem; }
  .form-label { display: block; font-size: 0.75rem; font-weight: 500; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: var(--font-body); font-size: 0.95rem; padding: 11px 14px; border-radius: 8px; outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text3); }
  .pw-wrap { position: relative; }
  .pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px; transition: color 0.2s; }
  .pw-toggle:hover { color: var(--accent); }
  .pw-toggle svg { width: 16px; height: 16px; display: block; }
  .login-btn { width: 100%; padding: 12px; background: var(--accent); color: #0a0a0f; border: none; border-radius: 8px; font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .login-btn:hover { background: #a7f3d0; transform: translateY(-1px); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .login-error { display: none; margin-top: 1rem; background: var(--danger-dim); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; text-align: center; }
  .login-hint { margin-top: 1.2rem; text-align: center; font-size: 0.75rem; color: var(--text3); }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(10,10,15,0.3); border-top-color: #0a0a0f; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ADMIN */
  #admin-screen { display: none; min-height: 100vh; }
  .admin-topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,10,15,0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; height: 60px; }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .topbar-logo { font-family: var(--font-head); font-weight: 700; font-size: 1rem; color: var(--text); }
  .topbar-logo span { color: var(--accent); }
  .topbar-badge { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(110,231,183,0.2); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .topbar-user { font-size: 0.8rem; color: var(--text3); margin-right: 4px; }
  .topbar-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; border: none; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border) !important; }
  .btn-ghost:hover { border-color: var(--border2) !important; color: var(--text); }
  .btn-danger { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(248,113,113,0.2) !important; }
  .btn-danger:hover { background: rgba(248,113,113,0.18); }
  .topbar-btn svg { width: 14px; height: 14px; }
  .admin-main { max-width: 1100px; margin: 0 auto; padding: 2rem; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 2rem; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.4rem; }
  .stat-label { font-size: 0.72rem; color: var(--text3); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
  .stat-value { font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; color: var(--text); line-height: 1; }
  .stat-value.green { color: var(--accent); }
  .stat-value.yellow { color: var(--warn); }
  .msg-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text3); pointer-events: none; }
  .search-input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); font-family: var(--font-body); font-size: 0.875rem; padding: 9px 14px 9px 38px; border-radius: 8px; outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text3); }
  .filter-btn { padding: 8px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--text2); font-family: var(--font-body); font-size: 0.8rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .msg-list { display: flex; flex-direction: column; gap: 10px; }
  .msg-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s; cursor: pointer; }
  .msg-card:hover { border-color: var(--border2); }
  .msg-card.unread { border-left: 3px solid var(--accent); }
  .msg-card.expanded { border-color: var(--border2); }
  .msg-header { display: flex; align-items: center; gap: 14px; padding: 1rem 1.2rem; }
  .msg-avatar { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; background: var(--accent-dim); border: 1px solid rgba(110,231,183,0.2); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 700; font-size: 0.9rem; color: var(--accent); }
  .msg-meta { flex: 1; min-width: 0; }
  .msg-name { font-weight: 600; color: var(--text); font-size: 0.9rem; }
  .msg-email { font-size: 0.78rem; color: var(--text3); }
  .msg-subject { font-size: 0.85rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .msg-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .msg-date { font-size: 0.72rem; color: var(--text3); }
  .msg-badges { display: flex; gap: 6px; align-items: center; }
  .unread-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }
  .msg-actions { display: flex; gap: 6px; }
  .action-btn { padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-family: var(--font-body); font-size: 0.72rem; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 4px; }
  .action-btn:hover { border-color: var(--border2); color: var(--text); }
  .action-btn.delete:hover { border-color: rgba(248,113,113,0.4); color: var(--danger); background: var(--danger-dim); }
  .action-btn svg { width: 11px; height: 11px; }
  .msg-body { display: none; padding: 0 1.2rem 1.2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
  .msg-body.show { display: block; }
  .msg-body-subject { font-size: 0.75rem; color: var(--text3); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }
  .msg-body-subject span { color: var(--text2); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .msg-body-text { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; color: var(--text2); font-size: 0.875rem; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg-body-actions { display: flex; gap: 8px; margin-top: 10px; }
  .reply-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 7px; background: var(--accent-dim); border: 1px solid rgba(110,231,183,0.2); color: var(--accent); font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; cursor: pointer; text-decoration: none; transition: all 0.2s; }
  .reply-btn:hover { background: rgba(110,231,183,0.18); }
  .reply-btn svg { width: 13px; height: 13px; }
  .empty-state { text-align: center; padding: 5rem 2rem; color: var(--text3); }
  .empty-state svg { width: 48px; height: 48px; margin: 0 auto 1rem; display: block; opacity: 0.4; }
  .empty-state h3 { font-family: var(--font-head); font-size: 1.1rem; color: var(--text2); margin-bottom: 0.4rem; }
  .empty-state p { font-size: 0.85rem; }
  .toast { position: fixed; bottom: 2rem; right: 2rem; z-index: 999; background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 12px 18px; border-radius: 10px; font-size: 0.85rem; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.4); transform: translateY(80px); opacity: 0; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast svg { width: 16px; height: 16px; color: var(--accent); flex-shrink: 0; }
  /* OVERLAYS */
  .overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 2rem; }
  .overlay.show { display: flex; }
  .confirm-box { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 2rem; max-width: 380px; width: 100%; text-align: center; }
  .confirm-icon { width: 52px; height: 52px; background: var(--danger-dim); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  .confirm-icon svg { width: 26px; height: 26px; color: var(--danger); }
  .confirm-box h3 { font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
  .confirm-box p { color: var(--text2); font-size: 0.875rem; margin-bottom: 1.5rem; }
  .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  .confirm-cancel { padding: 9px 20px; border-radius: 7px; border: 1px solid var(--border2); background: transparent; color: var(--text2); font-family: var(--font-body); font-size: 0.875rem; cursor: pointer; }
  .confirm-cancel:hover { color: var(--text); }
  .confirm-delete { padding: 9px 20px; border-radius: 7px; border: none; background: var(--danger); color: #fff; font-family: var(--font-body); font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  .confirm-delete:hover { background: #ef4444; }
  /* LOADING */
  .loading-state { text-align: center; padding: 4rem 2rem; color: var(--text3); }
  .loading-spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @media (max-width: 700px) { .stats-row { grid-template-columns: repeat(2, 1fr); } .admin-main { padding: 1rem; } .msg-subject, .topbar-badge, .topbar-user { display: none; } }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-bg"></div>
  <div class="login-grid"></div>
  <div class="login-card">
    <div class="login-logo">Ashish<span>.</span></div>
    <div class="login-sub">Admin Panel</div>
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </div>
    <div class="form-group">
      <label class="form-label" for="admin-email">Email</label>
      <input class="form-input" type="email" id="admin-email" onkeydown="if(event.key==='Enter')document.getElementById('admin-pw').focus()">
    </div>
    <div class="form-group">
      <label class="form-label" for="admin-pw">Password</label>
      <div class="pw-wrap">
        <input class="form-input" type="password" id="admin-pw" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pw-toggle" onclick="togglePw()" type="button">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      Sign In
    </button>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">Only the authorised admin account can access this panel.</div>
  </div>
</div>

<div id="admin-screen">
  <nav class="admin-topbar">
    <div class="topbar-left">
      <div class="topbar-logo">Ashish<span>.</span></div>
      <div class="topbar-badge">Admin Panel</div>
    </div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-user"></span>
      <button class="topbar-btn btn-ghost" onclick="markAllRead()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
        Mark all read
      </button>
      <button class="topbar-btn btn-ghost" onclick="exportMessages()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        Export
      </button>
      <button class="topbar-btn btn-danger" onclick="doLogout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Logout
      </button>
    </div>
  </nav>
  <div class="admin-main">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Total Messages</div><div class="stat-value" id="stat-total">0</div></div>
      <div class="stat-card"><div class="stat-label">Unread</div><div class="stat-value yellow" id="stat-unread">0</div></div>
      <div class="stat-card"><div class="stat-label">Read</div><div class="stat-value green" id="stat-read">0</div></div>
      <div class="stat-card"><div class="stat-label">Today</div><div class="stat-value" id="stat-today">0</div></div>
    </div>
    <div class="msg-toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="search-input" type="text" id="search-input" placeholder="Search by name, email or subject..." oninput="renderMessages()">
      </div>
      <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" id="filter-unread" onclick="setFilter('unread')">Unread</button>
      <button class="filter-btn" id="filter-read" onclick="setFilter('read')">Read</button>
    </div>
    <div class="msg-list" id="msg-list">
      <div class="loading-state"><div class="loading-spinner"></div>Loading messages...</div>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM -->
<div class="overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </div>
    <h3>Delete Message?</h3>
    <p>This action cannot be undone. The message will be permanently removed.</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-delete" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toast-text"></span>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy
  } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD1BWA2525-HO2sS6r364LCW_W61Pp4U5E",
    authDomain: "website-62333.firebaseapp.com",
    projectId: "website-62333",
    storageBucket: "website-62333.firebasestorage.app",
    messagingSenderId: "314674108842",
    appId: "1:314674108842:web:268ff690f7109051c333d3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let allMessages = [];
  let currentFilter = 'all';
  let deleteTargetId = null;
  let pwVisible = false;
  let unsubscribe = null;

  // --- AUTH STATE ---
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'block';
      document.getElementById('topbar-user').textContent = user.email;
      subscribeMessages();
    } else {
      document.getElementById('admin-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    }
  });

  window.doLogin = async function() {
    const email = document.getElementById('admin-email').value.trim();
    const pw = document.getElementById('admin-pw').value;
    const err = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    err.style.display = 'none';

    if (!email || !pw) {
      err.textContent = 'Please enter both email and password.';
      err.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Signing in...';

    try {
      await signInWithEmailAndPassword(auth, email, pw);
      document.getElementById('admin-pw').value = '';
    } catch (e) {
      let msg = 'Login failed. Please try again.';
      if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
        msg = 'Incorrect email or password.';
      } else if (e.code === 'auth/invalid-email') {
        msg = 'Please enter a valid email address.';
      } else if (e.code === 'auth/too-many-requests') {
        msg = 'Too many attempts. Please try again later.';
      }
      err.textContent = msg;
      err.style.display = 'block';
      document.getElementById('admin-pw').value = '';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg> Sign In';
    }
  }

  window.doLogout = function() {
    signOut(auth);
  }

  window.togglePw = function() {
    pwVisible = !pwVisible;
    const input = document.getElementById('admin-pw');
    input.type = pwVisible ? 'text' : 'password';
    document.getElementById('eye-icon').innerHTML = pwVisible
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  // --- MESSAGES (Firestore real-time) ---
  function subscribeMessages() {
    const q = query(collection(db, 'messages'), orderBy('date', 'desc'));
    unsubscribe = onSnapshot(q, (snapshot) => {
      allMessages = snapshot.docs.map(d => {
        const data = d.data();
        return {
          id: d.id,
          name: data.name || 'Unknown',
          email: data.email || '',
          subject: data.subject || '(No subject)',
          message: data.message || '',
          read: !!data.read,
          date: data.date && data.date.toDate ? data.date.toDate() : new Date()
        };
      });
      renderMessages();
    }, (error) => {
      console.error(error);
      document.getElementById('msg-list').innerHTML = '<div class="empty-state"><h3>Error loading messages</h3><p>' + error.message + '</p></div>';
    });
  }

  window.markRead = async function(id) {
    try { await updateDoc(doc(db, 'messages', id), { read: true }); } catch(e) { console.error(e); }
  }

  window.markAllRead = async function() {
    const unread = allMessages.filter(m => !m.read);
    if (!unread.length) { showToast('No unread messages'); return; }
    try {
      await Promise.all(unread.map(m => updateDoc(doc(db, 'messages', m.id), { read: true })));
      showToast('All messages marked as read');
    } catch(e) { console.error(e); showToast('Something went wrong'); }
  }

  window.deleteMessage = function(id) {
    deleteTargetId = id;
    document.getElementById('confirm-overlay').classList.add('show');
    document.getElementById('confirm-delete-btn').onclick = async () => {
      try {
        await deleteDoc(doc(db, 'messages', deleteTargetId));
        showToast('Message deleted');
      } catch(e) { console.error(e); showToast('Failed to delete'); }
      closeConfirm();
    };
  }

  window.closeConfirm = function() {
    document.getElementById('confirm-overlay').classList.remove('show');
    deleteTargetId = null;
  }

  window.setFilter = function(f) {
    currentFilter = f;
    ['all','unread','read'].forEach(x => document.getElementById('filter-'+x).classList.toggle('active', x===f));
    renderMessages();
  }

  window.exportMessages = function() {
    if (!allMessages.length) { showToast('No messages to export'); return; }
    const lines = allMessages.map(m => `From: ${m.name} <${m.email}>\nSubject: ${m.subject}\nDate: ${m.date.toLocaleString()}\n\n${m.message}\n${'─'.repeat(50)}`).join('\n\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines], {type:'text/plain'}));
    a.download = 'messages_' + new Date().toISOString().slice(0,10) + '.txt';
    a.click();
    showToast('Messages exported');
  }

  window.toggleExpand = function(id) {
    const body = document.getElementById('body-'+id);
    const card = document.getElementById('card-'+id);
    const isOpen = body.classList.contains('show');
    document.querySelectorAll('.msg-body.show').forEach(b => b.classList.remove('show'));
    document.querySelectorAll('.msg-card.expanded').forEach(c => c.classList.remove('expanded'));
    if (!isOpen) {
      body.classList.add('show'); card.classList.add('expanded');
      const m = allMessages.find(x => x.id === id);
      if (m && !m.read) markRead(id);
    }
  }

  function renderMessages() {
    let msgs = allMessages.slice();
    const q = document.getElementById('search-input').value.toLowerCase();
    if (currentFilter === 'unread') msgs = msgs.filter(m => !m.read);
    if (currentFilter === 'read') msgs = msgs.filter(m => m.read);
    if (q) msgs = msgs.filter(m => m.name.toLowerCase().includes(q) || m.email.toLowerCase().includes(q) || m.subject.toLowerCase().includes(q) || m.message.toLowerCase().includes(q));

    const today = new Date().toDateString();
    document.getElementById('stat-total').textContent = allMessages.length;
    document.getElementById('stat-unread').textContent = allMessages.filter(m => !m.read).length;
    document.getElementById('stat-read').textContent = allMessages.filter(m => m.read).length;
    document.getElementById('stat-today').textContent = allMessages.filter(m => m.date.toDateString() === today).length;

    const list = document.getElementById('msg-list');
    if (!msgs.length) {
      list.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg><h3>' + (q||currentFilter!=='all'?'No messages match':'No messages yet') + '</h3><p>' + (q||currentFilter!=='all'?'Try a different search or filter.':'Messages from your portfolio contact form will appear here.') + '</p></div>';
      return;
    }

    list.innerHTML = msgs.map(m => {
      const initials = m.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      return `<div class="msg-card ${m.read?'':'unread'}" id="card-${m.id}">
        <div class="msg-header" onclick="toggleExpand('${m.id}')">
          <div class="msg-avatar">${initials}</div>
          <div class="msg-meta"><div class="msg-name">${escHtml(m.name)}</div><div class="msg-email">${escHtml(m.email)}</div></div>
          <div class="msg-subject">${escHtml(m.subject)}</div>
          <div class="msg-right">
            <div class="msg-date">${formatDate(m.date)}</div>
            <div class="msg-badges">
              ${!m.read?'<div class="unread-dot"></div>':''}
              <div class="msg-actions" onclick="event.stopPropagation()">
                <button class="action-btn delete" onclick="deleteMessage('${m.id}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Delete
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="msg-body" id="body-${m.id}">
          <div class="msg-body-subject">Subject: <span>${escHtml(m.subject)}</span></div>
          <div class="msg-body-text">${escHtml(m.message)}</div>
          <div class="msg-body-actions">
            <a class="reply-btn" href="mailto:${escHtml(m.email)}?subject=Re: ${encodeURIComponent(m.subject)}" target="_blank">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg>Reply via Email
            </a>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  window.renderMessages = renderMessages;

  function formatDate(d) {
    const now = new Date(), diff = now - d;
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
    if (diff < 604800000) return Math.floor(diff/86400000) + 'd ago';
    return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toast-text').textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  document.getElementById('confirm-overlay').addEventListener('click', function(e) { if (e.target===this) closeConfirm(); });
</script>
</body>
</html>
